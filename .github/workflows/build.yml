name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: ArtemSydorov/buildozer-action@v1.2.0
      with:
        command: buildozer -v android debug
        subcommand: ""

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: chemical-balancer-apk
        path: bin/*.apk
